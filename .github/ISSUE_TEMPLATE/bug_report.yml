name: 问题反馈
description: 反馈可复现的功能或兼容性问题
title: "[问题] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿上传真实讲稿或其他敏感信息。

  - type: input
    id: app-version
    attributes:
      label: Hai提词器版本
      placeholder: 例如 0.3
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS 版本和 Mac 型号
      placeholder: 例如 macOS 15，M2 MacBook Air
    validations:
      required: true

  - type: dropdown
    id: scenario
    attributes:
      label: 使用场景
      options:
        - 普通窗口提词
        - PowerPoint 演示
        - OBS 录屏或直播
        - QuickTime 录屏
        - 语音跟读
        - 历史文本
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序说明问题发生前做了什么。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
